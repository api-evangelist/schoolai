aid: schoolai
name: SchoolAI
description: 'SchoolAI is an AI platform built specifically for K-12 and higher education
  that helps teachers personalize learning, monitor student progress in real time,
  and provide timely interventions while keeping educators in control of student safety.
  Its core surfaces include Spaces (teacher-designed AI learning environments), Mission
  Control (a live dashboard of student engagement and where learners are struggling),
  PowerUps (focused AI activities for creation, practice, and exploration), a browser
  extension, and professional-learning programs. The platform integrates with LMS and
  identity systems via Canvas LTI, Google Classroom, and Google Workspace, and is FERPA,
  COPPA, SOC 2 Type 2, 1EdTech TrustEd Apps, FIPPA, and ESSA Tier 3 validated. Backed
  by Homebrew; surfaced as a portfolio-lead company in the API Evangelist network.'
